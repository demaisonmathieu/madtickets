# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vps-48aa0bd2.vps.ovh.net;
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vps-48aa0bd2.vps.ovh.net;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/vps-48aa0bd2.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-48aa0bd2.vps.ovh.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/tickets-app/dist;
    index index.html;
    
    client_max_body_size 100m;

    # Types MIME standards + PWA
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg svgz;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        font/woff woff;
        font/woff2 woff2;
        application/manifest+json webmanifest;
        application/octet-stream bin exe dll;
        application/octet-stream deb;
        application/octet-stream dmg;
    }
    default_type application/octet-stream;
    
    # Headers pour PWA et caching
    add_header Service-Worker-Allowed "/";
    add_header Cache-Control "public, max-age=3600" always;
    
    # Pour sw.js : pas de cache ou cache court
    location = /sw.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/";
    }
    
    # Pour registerSW.js : pas de cache
    location = /registerSW.js {
        add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Proxy Odoo pour contourner CORS côté navigateur
    # Utiliser ensuite l'URL: https://vps-48aa0bd2.vps.ovh.net/odoo
    location /odoo/ {
        # CORS
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Odoo-Database" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass https://cogitime.odoo.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cogitime.odoo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}